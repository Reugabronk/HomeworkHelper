# Bouwt en test Verslagcoach en publiceert de site op GitHub Pages.
# Eenmalig instellen: Settings → Pages → Source: "GitHub Actions".
name: Bouwen en publiceren

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Publicaties wachten op elkaar en worden nooit halverwege afgebroken.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: false

jobs:
  bouwen:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run build
      - uses: actions/upload-pages-artifact@v4
        if: github.event_name != 'pull_request'
        with:
          path: dist

  publiceren:
    if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
    needs: bouwen
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      # Een (opnieuw gestarte) run van een oudere commit mag de nieuwste versie niet overschrijven.
      - name: Controleren of dit de nieuwste versie van main is
        id: nieuwste
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          laatste=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
          if [ "$laatste" = "${{ github.sha }}" ]; then echo "publiceren=ja" >> "$GITHUB_OUTPUT"; else echo "Overgeslagen: main staat al op $laatste"; fi
      - id: deployment
        if: steps.nieuwste.outputs.publiceren == 'ja'
        uses: actions/deploy-pages@v4
